<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CrownCart — a curated, immersive store for fashion, footwear, timepieces and technology. Beyond Ordinary." />
    <meta property="og:title" content="CrownCart | Beyond Ordinary" />
    <meta property="og:description" content="Discover a world of extraordinary choices." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CrownCart" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CrownCart — Curated For The Extraordinary" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <meta name="theme-color" content="#e6eaf5" />
    <title>CrownCart | Beyond Ordinary</title>
    <!-- Brand icons: the cart mark for browser tabs, the full logo badge for home screens and installs. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://rsms.me">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Galada&family=Manrope:wght@400;500;700&family=Major+Mono+Display&display=swap">
    <style>
      /* Branded intro screen. Shown before the app loads; everything here is plain CSS. */
      #cc-intro {
        position: fixed;
        inset: 0;
        z-index: 2147483300;
        display: grid;
        place-items: center;
        background: #c94449;
        overflow: hidden;
        /* Failsafe: if the app never takes over, the intro fades itself away. */
        animation: cc-intro-failsafe 0.5s ease 9s forwards;
      }
      @keyframes cc-intro-failsafe {
        to { opacity: 0; visibility: hidden; }
      }
      .cc-intro__badge {
        position: relative;
        width: min(62vmin, 360px);
        aspect-ratio: 1;
        animation: cc-intro-spin 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .cc-intro__w {
        position: absolute;
        inset: 0;
        background: url("/brand/icon-512.png") center / cover no-repeat;
        animation: cc-intro-piece 1.05s cubic-bezier(0.2, 0.9, 0.25, 1) var(--d) both;
      }
      .cc-intro__pulse {
        position: absolute;
        width: min(62vmin, 360px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        opacity: 0;
        animation: cc-intro-pulse 1.6s ease-out 1.5s infinite;
      }
      @keyframes cc-intro-spin {
        from { transform: rotate(-200deg) scale(0.55); }
      }
      @keyframes cc-intro-piece {
        from { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.4); opacity: 0; }
      }
      @keyframes cc-intro-pulse {
        0% { transform: scale(0.92); opacity: 0.7; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      /* Copies used for the crack hold the finished picture. */
      .cc-intro--still .cc-intro__badge,
      .cc-intro--still .cc-intro__w {
        animation: none;
      }
      .cc-intro--still .cc-intro__pulse {
        display: none;
      }
    </style>
    <link rel="preload" as="image" href="/brand/icon-512.png" />
  </head>
  <body>
    <noscript>CrownCart needs JavaScript to run. Please enable it to shop.</noscript>
    <div id="root"></div>
    <!-- Branded intro (first visit per session): badge pieces assemble, then the screen cracks
         open into the page (src/components/IntroReveal.tsx). Skipped by /intro.js when already seen
         or when reduced motion is preferred. -->
    <div id="cc-intro" aria-hidden="true">
      <div class="cc-intro__badge">
        <span class="cc-intro__w" style="--d:0ms;--dx:26.8vmin;--dy:-64.7vmin;--r:90deg;clip-path:polygon(50% 50%, 50.00% -50.00%, 120.71% -20.71%)"></span>
        <span class="cc-intro__w" style="--d:70ms;--dx:64.7vmin;--dy:-26.8vmin;--r:-90deg;clip-path:polygon(50% 50%, 120.71% -20.71%, 150.00% 50.00%)"></span>
        <span class="cc-intro__w" style="--d:140ms;--dx:64.7vmin;--dy:26.8vmin;--r:90deg;clip-path:polygon(50% 50%, 150.00% 50.00%, 120.71% 120.71%)"></span>
        <span class="cc-intro__w" style="--d:210ms;--dx:26.8vmin;--dy:64.7vmin;--r:-90deg;clip-path:polygon(50% 50%, 120.71% 120.71%, 50.00% 150.00%)"></span>
        <span class="cc-intro__w" style="--d:280ms;--dx:-26.8vmin;--dy:64.7vmin;--r:90deg;clip-path:polygon(50% 50%, 50.00% 150.00%, -20.71% 120.71%)"></span>
        <span class="cc-intro__w" style="--d:350ms;--dx:-64.7vmin;--dy:26.8vmin;--r:-90deg;clip-path:polygon(50% 50%, -20.71% 120.71%, -50.00% 50.00%)"></span>
        <span class="cc-intro__w" style="--d:420ms;--dx:-64.7vmin;--dy:-26.8vmin;--r:90deg;clip-path:polygon(50% 50%, -50.00% 50.00%, -20.71% -20.71%)"></span>
        <span class="cc-intro__w" style="--d:490ms;--dx:-26.8vmin;--dy:-64.7vmin;--r:-90deg;clip-path:polygon(50% 50%, -20.71% -20.71%, 50.00% -50.00%)"></span>
      </div>
      <span class="cc-intro__pulse"></span>
    </div>
    <script src="/intro.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
